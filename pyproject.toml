[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cobaldclusterisation"
version = "0.1.0"
description = "Parsing, embedding, and clustering helpers for CoBaLD semantic hierarchy experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "openpyxl>=3.1",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "tqdm>=4.64",
]

[project.scripts]
cobald = "cobaldclusterisation.cli:main"

[project.optional-dependencies]
embeddings = [
    "torch>=2.1",
    "transformers>=4.53.2",
]
external = [
    "datasets>=2.18",
]
collocations = [
    "nltk>=3.8",
]
graph = [
    "igraph>=0.11",
    "leidenalg>=0.10",
    "pynndescent>=0.5",
]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/cobaldclusterisation"]
